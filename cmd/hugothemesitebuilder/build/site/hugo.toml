
baseurl = "https://themes.gohugo.io/"
title   = "Hugo Themes"

# Merge in config from Hugo Docs.
_merge = "deep"

[taxonomies]
  tag = "tags"

# The shared Hugo Docs layouts run the stylesheet through css.TailwindCSS, and
# Hugo's default security policy does not allow that binary to be executed --
# note that the default node permissions below it already whitelist tailwindcss,
# so only the exec list is out of step. Without this the site build fails with
# `TAILWINDCSS: failed to transform "/css/styles.css" ... access denied`.
[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

[module]
  [module.hugoVersion]
    min = "0.145.0"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    disableWatch = true
    source       = "hugo_stats.json"
    target       = "assets/notwatching/hugo_stats.json"
  [[module.imports]]
    path = "github.com/gohugoio/hugoDocs"
    # We share the theme with the docs site, but we need to be explicit about
    # the mounts to avoid pulling in the content.
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "assets"
      target = "assets"
    [[module.imports.mounts]]
      source = "static"
      target = "static"
    [[module.imports.mounts]]
      source = "data"
      target = "data"
    [[module.imports.mounts]]
      source = "i18n"
      target = "i18n"

[outputs]
  home     = ["html", "redir", "headers"]
  page     = ["html"]
  section  = ["html"]
  taxonomy = ["html"]
  term     = ["html"]

[params]
  github_repo  = "https://github.com/gohugoio/hugoThemesSiteBuilder"
  gitter       = "https://gitter.im/spf13/hugo"
  forum        = "https://discourse.gohugo.io/"
  hideDemoLink = false
  hideContent  = true
  #This array is meant for disabling the Homepage button of a theme.
  noHomePage = ["hugo-theme-novela"]

[[menu.global]]
  name       = "News"
  weight     = 1
  identifier = "news"
  url        = "https://gohugo.io/news/"

[[menu.global]]
  name       = "Docs"
  weight     = 10
  identifier = "docs"
  url        = "https://gohugo.io/documentation/"

[[menu.global]]
  name       = "Themes"
  weight     = 15
  identifier = "themes"
  url        = "https://themes.gohugo.io/"

[[menu.global]]
  name       = "Community"
  weight     = 100
  post       = "external"
  identifier = "community"
  url        = "https://discourse.gohugo.io/"

[[menu.global]]
  name       = "GitHub"
  weight     = 200
  identifier = "github"
  post       = "external"
  url        = "https://github.com/gohugoio/hugo"
